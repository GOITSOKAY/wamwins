<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WAMWins Trades Demo</title>
<meta name="description" content="WAMWins Trades demo: ICT Library workflow, dispatch, van inventory, Loxone monitoring and cost comparison, with sample data.">
<meta name="theme-color" content="#0B49D1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WAMWins Trades">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face { font-family: "Poppins"; src: url("fonts/Poppins-Regular.ttf") format("truetype"); font-weight: 400; font-display: swap }
@font-face { font-family: "Poppins"; src: url("fonts/Poppins-Medium.ttf") format("truetype"); font-weight: 500; font-display: swap }
@font-face { font-family: "Poppins"; src: url("fonts/Poppins-Bold.ttf") format("truetype"); font-weight: 600 700; font-display: swap }
/* Layout: brand-blue rail of modules on the left (top tab strip on phones), working canvas on a cool light-gray ground.
   Red is reserved for alerts, notifications and (i) buttons; yellow marks the one primary action per view. */
:root {
  --blue: #0B49D1; --blue-ink: #0A3FB4; --blue-soft: #E7EEFC; --yellow: #FFC107; --yellow-soft: #FFF4CF;
  --red: #D32F2F; --red-strong: #C62828; --red-soft: #FDECEC; --ok: #13795B; --ok-soft: #E3F4EC; --warn: #9A6400; --warn-soft: #FFF3D6;
  --bg: #F3F6FB; --surface: #FFFFFF; --surface-2: #E8EEF7; --line: #D6DEEB; --ink: #0E1B3D; --ink-2: #4A5878; --ink-3: #6B7898;
  --font: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 12px; --r-s: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --blue: #6F9BFF; --blue-ink: #9BB9FF; --blue-soft: #16264A; --yellow: #FFC94A; --yellow-soft: #3A3010;
  --red: #FF8A80; --red-strong: #C62828; --red-soft: #3B1416; --ok: #6FDBB3; --ok-soft: #0E3327; --warn: #F2C46B; --warn-soft: #3A2C0E;
  --bg: #0C1324; --surface: #121C33; --surface-2: #1A2642; --line: #26355A; --ink: #EAF0FF; --ink-2: #B4C1DE; --ink-3: #8E9BBB; color-scheme: dark } }
:root[data-theme="dark"] {
  --blue: #6F9BFF; --blue-ink: #9BB9FF; --blue-soft: #16264A; --yellow: #FFC94A; --yellow-soft: #3A3010;
  --red: #FF8A80; --red-strong: #C62828; --red-soft: #3B1416; --ok: #6FDBB3; --ok-soft: #0E3327; --warn: #F2C46B; --warn-soft: #3A2C0E;
  --bg: #0C1324; --surface: #121C33; --surface-2: #1A2642; --line: #26355A; --ink: #EAF0FF; --ink-2: #B4C1DE; --ink-3: #8E9BBB; color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }
body { margin: 0 } img { max-width: 100% }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px) }
html, body { height: 100% }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); font-variant-numeric: tabular-nums }
button, input, select { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px }
.main:focus, .main:focus-visible { outline: none }
h1, h2, h3 { margin: 0; line-height: 1.25; text-wrap: balance }
h1 { font-size: 24px; font-weight: 700 } h2 { font-size: 17px; font-weight: 600 } h3 { font-size: 15px; font-weight: 600 }
p { margin: 0 }
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100% }
.rail { background: #0B49D1; color: #fff; padding: 20px 14px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px }
.brand img { width: 40px; height: 40px; border-radius: 10px }
.brand b { font-size: 17px; letter-spacing: .2px } .brand b span { color: #FFC107 }
.brand small { display: block; font-size: 11px; opacity: .8; letter-spacing: .6px; text-transform: uppercase }
.nav { display: flex; flex-direction: column; gap: 4px }
.nav a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; color: #DCE6FF; text-decoration: none; font-weight: 500; white-space: nowrap }
.nav a svg { width: 18px; height: 18px; flex: none }
.nav a:hover { background: rgba(255,255,255,.08); color: #fff }
.nav a[aria-current="page"] { background: #fff; color: #0B49D1 }
.nav a .count { margin-left: auto; background: #D32F2F; color: #fff; font-size: 11px; border-radius: 999px; padding: 0 7px; line-height: 18px }
.rail-foot { margin-top: auto; font-size: 11.5px; color: #C9D7FF; line-height: 1.5; padding: 0 6px }
.main { padding-block: 22px 60px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); min-width: 0 }
.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-bottom: 18px }
.topbar .clock { margin-left: auto; color: var(--ink-2); font-size: 13px }
.demo-chip { background: var(--yellow-soft); color: var(--warn); border: 1px solid var(--yellow); font-size: 12px; font-weight: 600; border-radius: 999px; padding: 3px 10px }
.lead { color: var(--ink-2); max-width: 70ch; margin-top: 4px }
.grid { display: grid; gap: 16px }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)) } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)) }
.g-side { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr) }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0 }
.panel-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px }
.panel-head .sub { color: var(--ink-3); font-size: 12.5px; margin-left: auto }
.info { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--red); color: var(--red); background: transparent; display: inline-grid; place-items: center; font: 700 12px/1 Georgia, serif; flex: none }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; text-align: left; display: flex; flex-direction: column; gap: 2px; text-decoration: none; color: inherit }
.kpi:hover { border-color: var(--blue) }
.kpi .v { font-size: 26px; font-weight: 700 } .kpi .l { color: var(--ink-2); font-size: 12.5px }
.kpi.alert { border-left: 4px solid var(--red) } .kpi.alert .v { color: var(--red) }
.kpi .note { font-size: 11.5px; color: var(--ink-3) }
.btn { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 16px; font-weight: 500; min-height: 40px; display: inline-flex; align-items: center; gap: 6px; justify-content: center }
.btn:hover { border-color: var(--blue) }
.btn.primary { background: var(--yellow); border-color: var(--yellow); color: #0E1B3D; font-weight: 600 }
.btn.blue { background: var(--blue); border-color: var(--blue); color: #fff }
.btn.danger { border-color: var(--red); color: var(--red) }
.btn.sm { min-height: 32px; padding: 4px 12px; font-size: 13px }
.btn[disabled] { opacity: .5; cursor: not-allowed }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; border-radius: 999px; padding: 2px 10px; white-space: nowrap; background: var(--surface-2); color: var(--ink-2) }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor }
.pill.ok { background: var(--ok-soft); color: var(--ok) } .pill.warn { background: var(--warn-soft); color: var(--warn) }
.pill.bad { background: var(--red-soft); color: var(--red) } .pill.info-p { background: var(--blue-soft); color: var(--blue) }
.pill.plain::before { display: none }
.table-wrap { overflow-x: auto; margin: 0 -4px }
table { width: 100%; border-collapse: collapse; font-size: 13px }
th { text-align: left; color: var(--ink-3); font-weight: 500; font-size: 12px; padding: 8px 6px; border-bottom: 1px solid var(--line); white-space: nowrap }
td { padding: 9px 6px; border-bottom: 1px solid var(--line); vertical-align: middle }
tr:last-child td { border-bottom: 0 }
td.num, th.num { text-align: right }
tr.sel td { background: var(--blue-soft) }
tbody tr.click { cursor: pointer } tbody tr.click:hover td { background: var(--surface-2) }
.muted { color: var(--ink-3) } .small { font-size: 12.5px }
.list { display: flex; flex-direction: column; gap: 8px }
.item { border: 1px solid var(--line); border-radius: var(--r-s); padding: 10px 12px; background: var(--surface); text-align: left; display: flex; flex-direction: column; gap: 4px; width: 100% }
button.item:hover { border-color: var(--blue) }
.item.sel { border-color: var(--blue); box-shadow: inset 3px 0 0 var(--blue) }
.item .top { display: flex; gap: 8px; align-items: center; justify-content: space-between }
/* workflow stepper */
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column }
.steps li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; position: relative; padding-bottom: 12px }
.steps li::before { content: ""; position: absolute; left: 12px; top: 26px; bottom: 0; width: 2px; background: var(--line) }
.steps li:last-child::before { display: none }
.dot { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--ink-3); border: 2px solid var(--line); z-index: 1 }
.steps li.done .dot { background: var(--blue); border-color: var(--blue); color: #fff }
.steps li.now .dot { background: var(--yellow); border-color: var(--yellow); color: #0E1B3D }
.steps li.done::before { background: var(--blue) }
.steps .lbl { font-weight: 500 } .steps li.todo .lbl { color: var(--ink-3) }
.steps .meta { font-size: 12px; color: var(--ink-3) }
.steps .added { font-size: 10.5px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase; color: var(--blue); margin-left: 6px }
.formcard { border: 1px dashed var(--blue); background: var(--blue-soft); border-radius: var(--r-s); padding: 12px; display: grid; gap: 8px }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; font-size: 13px }
.kv dt { color: var(--ink-3) } .kv dd { margin: 0 }
/* dispatch board */
.board { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface) }
.board-inner { min-width: 780px }
.b-row { display: grid; grid-template-columns: 150px minmax(0, 1fr); border-bottom: 1px solid var(--line); min-height: 58px }
.b-row:last-child { border-bottom: 0 }
.b-name { padding: 8px 10px; border-right: 1px solid var(--line); font-size: 12.5px; display: flex; flex-direction: column; justify-content: center }
.b-name b { font-size: 13px; font-weight: 600 }
.b-track { position: relative; background-image: linear-gradient(to right, var(--line) 1px, transparent 1px); background-size: calc(100% / 11) 100% }
.b-head .b-track { display: grid; grid-template-columns: repeat(11, 1fr); background: none; font-size: 11.5px; color: var(--ink-3) }
.b-head .b-track span { padding: 8px 4px; border-left: 1px solid var(--line) }
.blk { position: absolute; top: 7px; bottom: 7px; border-radius: 8px; padding: 3px 7px; font-size: 11.5px; line-height: 1.3; overflow: hidden; background: var(--blue-soft); border: 1.5px solid var(--blue); color: var(--ink) }
.blk b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.blk.done { opacity: .55 } .blk.urgent { border-color: var(--red); background: var(--red-soft) } .blk.new { border-color: var(--yellow); background: var(--yellow-soft); border-width: 2px }
.nowline { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--red); z-index: 2 }
.score { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; align-items: center }
.bar { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden } .bar i { display: block; height: 100%; background: var(--blue) }
/* monitoring */
.cam { aspect-ratio: 16/9; max-width: 100%; border-radius: var(--r-s); background: #0A1022; position: relative; overflow: hidden }
.cam canvas { width: 100%; height: 100%; display: block }
.cam .live { position: absolute; top: 10px; left: 10px; background: #C62828; color: #fff; font-size: 11px; font-weight: 600; border-radius: 4px; padding: 2px 7px }
.cam .ovl { position: absolute; left: 10px; right: 10px; bottom: 10px; color: #E6ECFF; font-size: 12px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap }
.alarm { border: 2px solid var(--red); background: var(--red-soft); border-radius: var(--r); padding: 14px; display: grid; gap: 10px }
.alarm h3 { color: var(--red) }
.chan { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px }
.chan div { background: var(--surface); border-radius: var(--r-s); padding: 8px 10px; font-size: 12.5px; border: 1px solid var(--line) }
svg text { font-family: var(--font) }
/* cost */
.inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px }
.field { display: grid; gap: 4px } .field label { font-size: 12.5px; color: var(--ink-2); font-weight: 500 }
.field output { font-weight: 600 }
input[type="range"] { width: 100%; accent-color: #0B49D1 }
select, input[type="number"] { border: 1.5px solid var(--line); background: var(--surface); border-radius: var(--r-s); padding: 8px 10px; min-height: 40px; width: 100% }
.saving { background: var(--ok-soft); color: var(--ok); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 2px }
.saving b { font-size: 24px }
.src { font-size: 12px; color: var(--ink-3) } .src a { color: var(--blue) }
/* toast + modal */
.toasts { position: fixed; z-index: 50; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; width: min(92vw, 440px); pointer-events: none }
.toast { background: #C62828; color: #fff; border-radius: var(--r-s); padding: 11px 14px; font-weight: 500; box-shadow: 0 10px 28px rgba(198,40,40,.3); pointer-events: auto }
.modal-back { position: fixed; inset: 0; background: rgba(8,14,32,.55); z-index: 60; display: grid; place-items: center; padding: 16px }
.modal { background: var(--surface); border-radius: var(--r); max-width: 460px; width: 100%; padding: 20px; display: grid; gap: 12px; border-top: 4px solid var(--red) }
.section-gap { display: grid; gap: 16px }
/* customer and field tools */
.newtag { font-size: 10.5px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase; background: var(--yellow); color: #0E1B3D; border-radius: 999px; padding: 1px 8px; vertical-align: 2px; margin-left: 4px }
.item.opt { cursor: pointer }
label.item { cursor: pointer } label.item .top { width: 100% }
.phone { max-width: 360px; margin: 0 auto; border: 8px solid var(--ink); border-radius: 28px; overflow: hidden; background: var(--bg) }
.phone-bar { background: #0B49D1; color: #fff; padding: 10px 14px; display: flex; justify-content: space-between; align-items: baseline; font-size: 13px }
.phone-bar span { font-size: 11.5px; color: #DCE6FF }
.phone-body { padding: 12px; display: grid; gap: 4px; min-height: 300px; align-content: start }
.phone-body input[type="text"] { border: 1.5px solid var(--line); background: var(--surface); border-radius: var(--r-s); padding: 8px 10px; min-height: 40px; width: 100% }
.sig { font-family: "Brush Script MT", "Segoe Script", cursive; font-size: 19px; color: var(--blue) }
.transcript { background: var(--surface-2); border-radius: var(--r-s); padding: 10px 12px; display: grid; gap: 6px; max-height: 260px; overflow-y: auto }
textarea { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r-s); padding: 8px 10px; width: 100%; resize: vertical }
.item.draft { gap: 6px }
@media (max-width: 1080px) { .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)) } .g-side { grid-template-columns: minmax(0, 1fr) } }
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr) }
  .rail { position: sticky; top: env(safe-area-inset-top, 0px); height: auto; z-index: 20; padding: 10px max(12px, env(safe-area-inset-left, 0px)) 8px max(12px, env(safe-area-inset-right, 0px)); gap: 8px }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: #0B49D1 }
  .brand img { width: 32px; height: 32px }
  .nav { flex-direction: row; overflow-x: auto; scrollbar-width: none } .nav::-webkit-scrollbar { display: none }
  .nav a { padding: 8px 12px }
  .rail-foot { display: none }
  .main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
  .g2, .g3 { grid-template-columns: minmax(0, 1fr) }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }
</style>
</head>

function microChart(rd) {
  const W = 420, H = 150, L = 44, B = 22, max = 2600, n = Math.max(20, rd.length);
  const X = i => L + (i / (n - 1)) * (W - L - 8), Y = v => 8 + (1 - v / max) * (H - B - 8);
  const pts = rd.map((v, i) => `${X(i)},${Y(v)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Micron readings over time" style="width:100%;height:auto;max-width:100%">
    ${[0, 500, 1000, 2000].map(v => `<line x1="${L}" x2="${W - 8}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="10" fill="var(--ink-3)">${v}</text>`).join('')}
    <line x1="${L}" x2="${W - 8}" y1="${Y(500)}" y2="${Y(500)}" stroke="var(--ok)" stroke-dasharray="4 4"/><text x="${W - 10}" y="${Y(500) - 5}" text-anchor="end" font-size="10" fill="var(--ok)">500 target</text>
    <polyline points="${pts}" fill="none" stroke="var(--blue)" stroke-width="2.2"/>
    <circle cx="${X(rd.length - 1)}" cy="${Y(rd[rd.length - 1])}" r="4" fill="var(--blue)"/>
    <text x="${L}" y="${H - 6}" font-size="10" fill="var(--ink-3)">0 min</text><text x="${W - 8}" y="${H - 6}" text-anchor="end" font-size="10" fill="var(--ink-3)">${n - 1} min</text></svg>`;
}
function drawCam() {   // a still, stylized placeholder for the live camera (no real video in the demo)
  const c = el('camc'); if (!c) return; const g = c.getContext('2d');
  const grd = g.createLinearGradient(0, 0, 640, 360); grd.addColorStop(0, '#1B2742'); grd.addColorStop(1, '#0A1022'); g.fillStyle = grd; g.fillRect(0, 0, 640, 360);
  g.fillStyle = '#2B3A5E'; g.fillRect(380, 90, 200, 210); g.fillStyle = '#34466F'; for (let i = 0; i < 9; i++) g.fillRect(392, 104 + i * 20, 176, 8);
  g.strokeStyle = '#C98A4B'; g.lineWidth = 9; g.beginPath(); g.moveTo(0, 250); g.lineTo(300, 250); g.quadraticCurveTo(340, 250, 360, 215); g.lineTo(380, 190); g.stroke();
  g.lineWidth = 6; g.beginPath(); g.moveTo(0, 278); g.lineTo(320, 278); g.quadraticCurveTo(360, 278, 380, 250); g.stroke();
  const fl = g.createRadialGradient(300, 250, 2, 300, 250, 46); fl.addColorStop(0, 'rgba(255,240,200,.95)'); fl.addColorStop(.4, 'rgba(255,170,60,.55)'); fl.addColorStop(1, 'rgba(255,120,0,0)'); g.fillStyle = fl; g.beginPath(); g.arc(300, 250, 46, 0, 7); g.fill();
  g.strokeStyle = 'rgba(255,193,7,.9)'; g.lineWidth = 2; g.setLineDash([6, 5]); g.strokeRect(258, 214, 84, 72); g.setLineDash([]);
  g.fillStyle = 'rgba(255,193,7,.95)'; g.font = '600 13px Poppins, sans-serif'; g.fillText('Joint 3 · N₂ 4 SCFH', 258, 206);
}

    const A = n * st * 12 + dir, B = dir + devs + hostY, C = n * lic * 12 + hostY + dir;

    }).join('')}</svg>`;
    const save = A - C;
    el('saving').innerHTML = save > 0 ? `<span>Option C saves Cassidy</span><b>${fmt$(save)} a year</b><span class="small">compared with staying on ServiceTitan, before ServiceTitan's one-time implementation fee of $5,000–$50,000</span>` : `<span>At these settings WAMWins does not save money</span><b>${fmt$(-save)} more a year</b><span class="small">Lower the license price or check the technician count.</span>`;
    el('saving').style.background = save > 0 ? '' : 'var(--red-soft)'; el('saving').style.color = save > 0 ? '' : 'var(--red)';

  };
  ids.forEach(i => el(i).addEventListener('input', calc)); calc();
};

  </div>
  <section class="panel" style="margin-top:16px"><div class="panel-head"><h2>Drafts for review ${newTag}</h2>${pill('info-p', 'Later tier')}${info('Drafts for review', 'WAMWins drafts the completion report, invoice and customer message from the technician\'s short notes. Nothing is sent or posted until a person approves it, and the person can edit the draft first.')}</div>
    <div class="grid g3">${DRAFTS.map(d => `<div class="item draft"><div class="top"><b>${d.kind}</b>${d.status === 'review' ? pill('warn', 'Needs approval') : d.status === 'sent' ? pill('ok', 'Approved and sent') : pill('plain', 'Discarded')}</div>
      <span class="small muted">${d.job}</span><span class="small"><b>Technician notes:</b> ${esc(d.notes)}</span>
      ${d.status === 'review' ? `<label class="small muted" for="dt-${d.id}">AI draft (you can edit)</label><textarea id="dt-${d.id}" rows="5">${esc(d.text)}</textarea>
      <div class="row"><button class="btn sm primary" type="button" data-approve="${d.id}">Approve${d.kind === 'Invoice' ? ' and post' : ' and send'}</button><button class="btn sm danger" type="button" data-discard="${d.id}">Discard</button></div>` : `<span class="small">${esc(d.text)}</span>`}</div>`).join('')}</div></section>
  <div class="grid g-side" style="margin-top:16px">
    <section class="panel"><div class="panel-head"><h2>AI phone answering ${newTag}</h2>${pill('info-p', 'Later tier')}${info('AI phone answering', 'Inbound calls are answered, the request is captured and a Service Request is created. Every call starts by saying it is recorded, because Florida requires every party to consent to recording (Fla. Stat. 934.03). Calls a person must handle are flagged for the office.')}</div>
      <div class="list">${CALLS.map(c => `<button class="item ${c.id === call.id ? 'sel' : ''}" type="button" data-call="${c.id}"><div class="top"><b>${c.who}</b>${c.status === 'review' ? pill('warn', 'Needs a person') : pill('ok', c.out)}</div><span class="small muted">${c.t} · ${c.dur} · ${c.summary}</span></button>`).join('')}</div></section>
    <section class="panel"><div class="panel-head"><h2>${call.id} · ${call.t}</h2><span class="sub">${call.dur}</span></div>
      <p class="small" style="margin-bottom:8px"><b>Summary:</b> ${call.summary}</p>
      <div class="transcript">${call.tr.map(([w, t], i) => `<p class="small"><b>${w === 'AI' ? 'WAMWins' : 'Caller'}:</b> ${t}${i === 0 ? ` <span class="pill plain">Recording notice</span>` : ''}</p>`).join('')}</div>
      <div class="row" style="margin-top:10px">${call.status === 'review' ? `<button class="btn primary" type="button" id="mkreq">Create service request</button><button class="btn" type="button" id="cbk">Log callback done</button>` : `<span class="small">${pill('ok', call.out)}</span>`}</div>
      <p class="src" style="margin-top:8px">Recordings and transcripts follow the consent and retention rules in the requirements.</p></section>
  </div>`);
  const V = el('view');
  V.querySelector("#tclock").onclick = () => {
    if (STATE.clockIn) { TIME.push({ job: 'J-24117', what: 'Install new motor', s: STATE.clockIn, e: STATE.clockIn + 30 }); STATE.clockIn = null; toast('Clocked out: 0.50 h added to J-24117. Job costing now uses actual hours.'); }
    else { STATE.clockIn = NOW_MIN; toast('Clocked in on J-24117 at ' + hhmm(NOW_MIN) + '.'); }
    VIEWS.field();
  };
  V.querySelector('#snap')?.addEventListener('click', () => { RECEIPTS.push({ id: 'RC-202', t: hhmm(NOW_MIN), ...SAMPLE_RECEIPT, status: 'check' }); toast('Receipt read: $58.36, 2 items. Check and file it.'); VIEWS.field(); });
  V.querySelectorAll('[data-file]').forEach(b => b.onclick = () => {
    const r = RECEIPTS.find(x => x.id === b.dataset.file); r.status = 'filed';
    run.mat.push(['Supply-house receipt ' + r.id, 1, r.amt]);
    const van = VANS.find(v => v.id === 'V-101'); van.events.push({ t: hhmm(NOW_MIN), item: 'Run capacitor 5 µF (2) from receipt ' + r.id, rfid: '2 tags added', cam: 'Loading seen', pr: 'Receipt ' + r.id, res: 'ok' });
    toast(`${r.id} filed: ${fmt$(r.amt)} added to J-24117 costing and the parts to V-101 stock.`); VIEWS.field();
  });
  V.querySelectorAll('[data-approve]').forEach(b => b.onclick = () => { const d = DRAFTS.find(x => x.id === b.dataset.approve); d.text = el('dt-' + d.id).value; d.status = 'sent'; toast(`${d.kind} for ${d.job.split(' · ')[0]} approved${d.kind === 'Invoice' ? ' and posted' : ' and sent'}.`); renderNav(); VIEWS.field(); });
  V.querySelectorAll('[data-discard]').forEach(b => b.onclick = () => { const d = DRAFTS.find(x => x.id === b.dataset.discard); d.status = 'discarded'; toast(`${d.kind} draft discarded. Nothing was sent.`); renderNav(); VIEWS.field(); });
  V.querySelectorAll('[data-call]').forEach(b => b.onclick = () => { STATE.call = b.dataset.call; VIEWS.field(); });
  V.querySelector('#mkreq')?.addEventListener('click', () => {
    call.status = 'done'; call.out = 'Created Q-' + (590 + QUEUE.length);
    QUEUE.push({ id: 'Q-' + (590 + QUEUE.length), title: 'No hot water; replacement price', customer: 'Patel residence, Jupiter', skill: 'Plumbing', part: '—', mins: 60, pri: 'High' });
    toast('Service request created from the call and added to the dispatch queue.'); renderNav(); VIEWS.field();
  });
  V.querySelector('#cbk')?.addEventListener('click', () => { call.status = 'done'; call.out = 'Callback done by office'; toast('Callback logged.'); renderNav(); VIEWS.field(); });
};

addEventListener('hashchange', go); go();
})();
</script>

<script>
// ---------- installable app (PWA): service worker for offline use, Install button with a fallback guide
(() => {
  const btn = document.getElementById('install');
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  let deferred = null;
  const say = msg => { const box = document.getElementById('toasts'), t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; box.append(t); setTimeout(() => t.remove(), 5000); return t; };
  if (!standalone) btn.hidden = false;
  addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; });
  addEventListener('appinstalled', () => { deferred = null; btn.hidden = true; say('WAMWins Trades is installed.'); });
  btn.addEventListener('click', async () => {
    if (deferred) { deferred.prompt(); const r = await deferred.userChoice; if (r.outcome === 'accepted') btn.hidden = true; deferred = null; return; }
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const back = document.createElement('div'); back.className = 'modal-back';
    back.innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="it"><h2 id="it">Install WAMWins Trades</h2>' +
      (ios ? '<p class="lead">In Safari, tap the Share button, then <b>Add to Home Screen</b>.</p>'
           : '<p class="lead">Your browser did not offer an install prompt here. Use its menu instead:</p><ul class="lead" style="margin:0;padding-left:18px"><li><b>Android, Chrome:</b> menu (three dots) then <b>Install app</b> or <b>Add to Home screen</b>.</li><li><b>Computer, Chrome or Edge:</b> the install icon at the right of the address bar.</li><li><b>iPhone or iPad:</b> open this page in Safari, Share, then <b>Add to Home Screen</b>.</li></ul>') +
      '<div class="row" style="justify-content:flex-end"><button class="btn primary" type="button">Got it</button></div></div>';
    const ok = back.querySelector('button'), close = () => { back.remove(); btn.focus(); };
    ok.onclick = close; back.addEventListener('click', e => { if (e.target === back) close(); });
    back.addEventListener('keydown', e => { if (e.key === 'Escape') close(); if (e.key === 'Tab') { e.preventDefault(); ok.focus(); } });
    document.body.append(back); ok.focus();
  });
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').then(reg => {
      const offer = w => { const t = say('A new version of the demo is ready. '); const b = document.createElement('button'); b.textContent = 'Reload'; b.style.cssText = 'margin-left:8px;background:none;border:0;color:#fff;font-weight:700;text-decoration:underline'; b.onclick = () => w.postMessage('SKIP_WAITING'); t.append(b); };
      if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
      reg.addEventListener('updatefound', () => { const w = reg.installing; w && w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) offer(w); }); });
    }).catch(() => {});
    // reload only when an installed copy switches to a new version, never on the very first visit
    const hadController = !!navigator.serviceWorker.controller; let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !reloaded) { reloaded = true; location.reload(); } });
  }
})();
</script>
